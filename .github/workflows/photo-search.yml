name: Photo search
on:
  push:
    paths: ["_video/tools/queries.json", "_video/tools/photo_search.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow playwright && python -m playwright install --with-deps chromium
      - run: python _video/tools/photo_search.py _video/tools/queries.json ps
      - env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          cd ps && zip -q ../photos.zip *.jpg results.json
          gh release create "photos-${{ github.run_id }}" ../photos.zip -R ${{ github.repository }} --prerelease --title "photos-${{ github.run_id }}" --notes "Photo search contact sheets (not for the site)."
