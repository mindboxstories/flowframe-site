name: Photo search
on:
  push:
    paths: ["_pins/photo_queries.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _pins/photo_search.py
      - run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add _pins/photos.json
          git diff --cached --quiet && exit 0
          git commit -m "Photo search results [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
