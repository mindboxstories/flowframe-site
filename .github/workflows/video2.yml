name: Render guide video v2
on:
  push:
    paths: ["_video/*/v2.json", "_video/v2/**"]
  workflow_dispatch:
    inputs:
      slug: {description: "folder under _video", default: "gifts-for-her"}
permissions:
  contents: write
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: {SLUG: "${{ inputs.slug || 'gifts-for-her' }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: "apt, with retry"
        run: for i in 1 2 3; do timeout 300 sh -c 'sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg && command -v ffmpeg' && break; echo retry $i; done
      - name: "pip, with timeout + retry (pip torch hung 20+ min on 24 Nov)"
        run: |
          for i in 1 2 3; do timeout 420 pip install -q --timeout 60 torch --index-url https://download.pytorch.org/whl/cpu && break; echo retry torch $i; done
          for i in 1 2 3; do timeout 420 pip install -q --timeout 60 "kokoro>=0.9.4" soundfile numpy pillow playwright && break; echo retry pip $i; done
      - run: python -m playwright install --with-deps chromium
      - name: Render
        run: python _video/v2/make2.py _video/$SLUG/v2.json
      - name: QA numbers
        run: |
          cd _video/out/$SLUG-v2
          { echo "== loudness"; ffmpeg -hide_banner -nostats -i video.mp4 -af ebur128=peak=true -f null - 2>&1 | tail -12
            echo "== opening silence"; ffmpeg -hide_banner -nostats -t 2 -i video.mp4 -af silencedetect=n=-40dB:d=0.3 -f null - 2>&1 | grep silence_ || echo none
            echo "== voice gaps >0.8s"; ffmpeg -hide_banner -nostats -i voice_n.wav -af silencedetect=n=-45dB:d=0.8 -f null - 2>&1 | grep silence_duration || echo none
            echo "== freezes >2s"; ffmpeg -hide_banner -nostats -i video.mp4 -vf freezedetect=n=0.003:d=2 -map 0:v -f null - 2>&1 | grep freeze_ || echo none
            echo "== black"; ffmpeg -hide_banner -nostats -i video.mp4 -vf blackdetect=d=0.2:pix_th=0.08 -an -f null - 2>&1 | grep black_ || echo none
            echo "== bitrate"; ffprobe -v error -show_entries format=duration,bit_rate:stream=codec_name,width,height,r_frame_rate -of compact video.mp4
            echo "== voice vs bed (whole file)"; for f in voice_n.wav bed.wav; do echo $f; ffmpeg -hide_banner -nostats -i $f -af ebur128 -f null - 2>&1 | grep -E "^\s+I:" | tail -1; done
          } > qa.txt 2>&1; cat qa.txt
      - name: Release
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          cd _video/out/$SLUG-v2
          zip -qr qa.zip frames captions.srt chapters.txt timeline.json qa.txt $(ls thumb.jpg 2>/dev/null)
          mv video.mp4 $SLUG-v2.mp4
          gh release create "video2-$SLUG-${{ github.run_id }}" $SLUG-v2.mp4 qa.zip captions.srt $(ls thumb.jpg 2>/dev/null) -R ${{ github.repository }} --prerelease --title "video2-$SLUG-${{ github.run_id }}" --notes "Guide video v2 (motion graphics). Not for the site."
