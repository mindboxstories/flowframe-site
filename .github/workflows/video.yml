name: Render guide video
on:
  push:
    paths: ["_video/*/script.json", "_video/make.py", "_video/thumb.py"]
  workflow_dispatch:
    inputs:
      slug: {description: "folder under _video", default: "gifts-for-her"}
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile numpy pillow playwright
          python -m playwright install --with-deps chromium
      - name: Thumbnails
        run: python _video/thumb.py _video/${{ inputs.slug || 'gifts-for-her' }}/script.json
      - name: Video
        run: python _video/make.py _video/${{ inputs.slug || 'gifts-for-her' }}/script.json
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.slug || 'gifts-for-her' }}
          path: |
            _video/out/*/video.mp4
            _video/out/*/captions.srt
            _video/out/*/chapters.txt
            _video/out/*/timeline.json
            _video/out/*/frames/
            _video/out/*/thumb-*.jpg
          retention-days: 30
