name: Render pins
on:
  push:
    paths: ["_pins/specs.json","_pins/build.py","_pins/render.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python _pins/build.py && python _pins/render.py
      - run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add pins/v7
          git diff --cached --quiet || (git commit -m "Render pins [skip ci]" && git push)
